# ============================================================
# SDR AI 助手 - 开发环境基础设施
# 启动：docker-compose up -d
# 停止：docker-compose down
# 数据卷清理：docker-compose down -v
# ============================================================
version: '3.8'

services:
  # ============== MySQL 8.0（业务数据，ARCHITECTURE.md §4） ==============
  mysql:
    image: mysql:8.0
    container_name: sdr-mysql
    environment:
      MYSQL_ROOT_PASSWORD: sdr_root
      MYSQL_DATABASE: sdrdb
      MYSQL_USER: sdr
      MYSQL_PASSWORD: sdr_pass
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usdr", "-psdr_pass"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ============== Redis 7（运行时 KV，ARCHITECTURE.md §5） ==============
  redis:
    image: redis:7-alpine
    container_name: sdr-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ============== MailHog（邮件 mock，ARCHITECTURE.md §8） ==============
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sdr-mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI（看发出的邮件）
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
