# ============================================================
# SDR AI 助手 - 默认配置（教学版）
# 真实 key / 密码请放到 application-local.yml（已被 .gitignore 排除）
# ============================================================

server:
  port: 8091   # 避开 smart-doc-assistant 的 8090 端口

spring:
  application:
    name: sdr-ai-assistant

  # ============== MySQL 8.0（业务数据，docker-compose 启） ==============
  datasource:
    url: jdbc:mysql://localhost:3306/sdrdb?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: sdr
    password: sdr_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  # ============== Redis 7（运行时 KV，docker-compose 启） ==============
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ============== 邮件发送（开发用 MailHog，生产换真实 SMTP） ==============
  mail:
    host: localhost       # MailHog 容器
    port: 1025
    username: ""
    password: ""
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000

# ============================================================
# MyBatis-Plus 配置
# ============================================================
mybatis-plus:
  mapper-locations: classpath:mappers/**/*.xml
  type-aliases-package: com.example.sdr.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false

# ============================================================
# Spring StateMachine 配置
# ============================================================
spring.statemachine:
  data:
    redis:
      repositories:
        enabled: true

# ============================================================
# LangChain4j 配置
# ============================================================
langchain4j:
  open-ai:
    chat-model:
      api-key: ${DASHSCOPE_API_KEY:sk-replace-me}
      model-name: qwen3.7-flash-2026-07-15
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      temperature: 0.7
      timeout: PT60S
      log-requests: false
      log-responses: false
    streaming-chat-model:
      api-key: ${DASHSCOPE_API_KEY:sk-replace-me}
      model-name: qwen3.7-flash-2026-07-15
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      temperature: 0.7
      timeout: PT60S

# ============================================================
# SDR 业务配置
# ============================================================
sdr:
  # ============== FSM 状态机配置（详见 SdrProperties.Fsm） ==============
  fsm:
    # 阶段四"72小时静默期"—— 教学版 2h（生产 72h = 259200000）
    step-wait-timeout-ms: 7200000
    # 阶段五"90天盘活"—— 教学版 5min（生产 90d = 7776000000）
    dormant-activation-ms: 300000
    # 阶段四最大追发轮次（业务 3 轮）
    max-followup-rounds: 3

  # ============== 定时器扫描频率（详见 SdrProperties.Scheduler） ==============
  scheduler:
    # STEP1_SENT 状态扫描—— 每 1 分钟检查 72h 超时
    step1-scan-interval-ms: 60000
    # DORMANT 状态扫描—— 每 1 小时检查 90 天盘活
    dormant-scan-interval-ms: 3600000
    # Bandit 评估—— 每 10 分钟跑一次算法
    bandit-eval-interval-ms: 600000

  # ============== Agent 处理（详见 SdrProperties.Agent） ==============
  agent:
    # 单个 Agent 调用超时 30s
    call-timeout-ms: 30000
    # 失败重试 2 次
    max-retries: 2
    # 重试间隔 2s
    retry-interval-ms: 2000

  # ============== 多臂老虎机（详见 SdrProperties.Bandit） ==============
  bandit:
    strategy: thompson-sampling     # 算法选择
    exploration-factor: 0.1         # 探索因子
    retrain-threshold: 100          # DPO 样本≥此阈值才重训

  # ============== MCP Server ==============
  mcp:
    server-enabled: true            # 启用 stdio MCP Server
    http-port: 8092                 # 未来扩展 HTTP MCP 传输用

  # ============== 工具池（详见 SdrProperties.Tools） ==============
  tools:
    smtp-pool-size: 3               # SMTP 发信账户池
    domain-pool-size: 5             # 独立发信域名池（防封号）

  # ============== Demo（详见 SdrProperties.Demo） ==============
  demo:
    # 阶段一是否真实调 InquiryAssessorAgent（需 DASHSCOPE_API_KEY）
    # false → canned 评估，无 key 环境（CI/本地）可跑
    use-real-agent: true

logging:
  level:
    com.example.sdr: INFO
    com.baomidou.mybatisplus: WARN
    org.springframework.statemachine: INFO
    dev.langchain4j: INFO