# ============================================================
# 招聘 AI 助手 - 开发环境基础设施
# 启动：docker-compose up -d
# 停止：docker-compose down
# 数据卷清理：docker-compose down -v
# ============================================================
version: '3.8'

services:
  # ============== MySQL 8.0（业务数据，ARCHITECTURE.md §4） ==============
  mysql:
    image: mysql:8.0
    container_name: hiring-mysql
    environment:
      MYSQL_ROOT_PASSWORD: hiring_root
      MYSQL_DATABASE: hiringdb
      MYSQL_USER: hiring
      MYSQL_PASSWORD: hiring_pass
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uhiring", "-phiring_pass"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # ============== Redis（运行时 KV + FSM 快照，ARCHITECTURE.md §5） ==============
  redis:
    image: redis:7-alpine
    container_name: hiring-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
